<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n>SnapVision — AI 金融终端</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
<style>
:root {
  --bg: #0a0b0f; --surface: #111318; --elevated: #1a1d24;
  --glass: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.12);
  --accent: #f59e0b; --accent-glow: rgba(245,158,11,0.25);
  --up: #ff6b6b; --down: #51cf66;
  --t1: rgba(255,255,255,0.94); --t2: rgba(255,255,255,0.65); --t3: rgba(255,255,255,0.42);
  --radius: 16px;
  --ease: cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;color:var(--t1);background:var(--bg);scroll-behavior:auto}
html,body{overflow-x:hidden;max-width:100vw}
body{background:var(--bg)}

.scroll-container{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
  max-width:100vw;
}
.scroll-container::-webkit-scrollbar{width:0}
.section{
  min-height:100vh;width:100%;max-width:100vw;
  display:flex;align-items:center;justify-content:center;
  padding:40px 24px;overflow-x:hidden;
}
.section-inner{width:100%;max-width:960px;margin:0 auto;overflow-x:hidden}

/* ── Background ── */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.06;will-change:transform}
.bg-orb:nth-child(1){width:600px;height:600px;background:radial-gradient(circle,var(--accent-glow),transparent);top:-100px;left:-100px}
.bg-orb:nth-child(2){width:400px;height:400px;background:radial-gradient(circle,rgba(81,207,102,0.12),transparent);bottom:-80px;right:-80px}
.bg-orb:nth-child(3){width:300px;height:300px;background:radial-gradient(circle,rgba(245,158,11,0.08),transparent);top:40%;left:50%}

/* ── Glass Card ── */
.glass{
  background:var(--glass);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:0 2px 12px rgba(0,0,0,0.25);
  max-width:100%;overflow:hidden;
}
.glass:hover{border-color:var(--border-strong)}

/* ── Nav ── */
.top-nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.top-nav>*{pointer-events:auto}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#f97316);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.nav-logo-text{font-size:18px;font-weight:700;color:var(--t1)}
.nav-actions{display:flex;gap:8px}
.nav-btn{padding:8px 18px;border-radius:100px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.82);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s var(--ease)}
.nav-btn:hover{background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(255,255,255,0.2)}
.nav-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}

/* ── HERO Section ── */
.hero-content{text-align:center}
.hero-title{font-size:clamp(36px,6vw,64px);font-weight:700;letter-spacing:-1.5px;line-height:1.08;margin-bottom:16px}
.hero-sub{font-size:18px;color:var(--t2);margin-bottom:48px;line-height:1.5}
.upload-zone{position:relative;width:100%;padding:64px 32px;text-align:center;cursor:pointer;overflow:hidden;transition:all 0.5s var(--ease);border:1px dashed rgba(255,255,255,0.12);border-radius:var(--radius);background:rgba(255,255,255,0.02)}
.upload-zone:hover{border-color:var(--accent);background:rgba(245,158,11,0.04);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.upload-zone.drag-active{border-color:var(--accent);box-shadow:0 0 60px var(--accent-glow);background:rgba(245,158,11,0.06)}
.upload-icon{font-size:48px;margin-bottom:16px}
.upload-zone h3{font-size:20px;font-weight:600;margin-bottom:6px;color:var(--t1)}
.upload-zone p{font-size:14px;color:var(--t3)}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;animation:scan 2.5s ease-in-out infinite;pointer-events:none}
@keyframes scan{0%{top:-2px;opacity:0}20%{opacity:1}80%{opacity:1}100%{top:100%;opacity:0}}
.file-chosen{margin-top:16px;padding:10px 16px;border-radius:12px;background:rgba(245,158,11,0.08);font-size:13px;color:var(--accent);display:none;align-items:center;gap:8px}
.file-chosen.show{display:flex}

/* ── Analysis Section ── */
.analysis-layout{display:flex;flex-direction:column;gap:20px;width:100%}
.analysis-main{display:flex;flex-direction:column;gap:20px}
.analysis-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stock-hero{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:12px}
.stock-name{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.stock-code{font-size:14px;color:var(--t3);margin-top:4px}
.stock-price{font-size:40px;font-weight:200;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.stock-change{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:100px;font-size:14px;font-weight:600;margin-top:4px}
.stock-change.up{background:rgba(255,107,107,0.12);color:var(--up)}
.stock-change.down{background:rgba(81,207,102,0.12);color:var(--down)}
.chart-wrap{position:relative;height:300px;margin:0}
.chart-wrap.vol{height:100px}
.signal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.signal-row:last-child{border-bottom:none}
.signal-label{font-size:13px;color:var(--t2);font-weight:500}
.signal-value{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:100px;font-size:12px;font-weight:600}
.badge-bull{background:rgba(255,107,107,0.12);color:var(--up)}
.badge-bear{background:rgba(81,207,102,0.12);color:var(--down)}
.badge-neutral{background:rgba(255,255,255,0.06);color:var(--t2)}

.sector-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x mandatory}
.sector-scroll::-webkit-scrollbar{height:0}
.sector-card{min-width:180px;padding:16px;scroll-snap-align:start;flex-shrink:0}
.sector-card-name{font-size:15px;font-weight:600;margin-bottom:4px}
.sector-card-price{font-size:18px;font-weight:700}
.sector-card-change{font-size:12px;font-weight:600;margin-top:4px}
.sector-card-change.up{color:var(--up)}.sector-card-change.down{color:var(--down)}
.sector-card-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;background:rgba(255,255,255,0.05);color:var(--t3);margin-top:6px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;background:rgba(255,255,255,0.05);color:var(--t2)}

.score-ring{position:relative;width:140px;height:140px}
.score-ring svg{position:absolute;inset:0}
.score-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num{font-size:42px;font-weight:200;letter-spacing:-2px;line-height:1}
.score-label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.m-label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px}
.m-badge{display:inline-block;padding:3px 12px;border-radius:100px;font-size:12px;font-weight:600;background:rgba(255,255,255,0.06);color:var(--t2)}
.strat-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--t2)}
.strat-val{font-weight:600;color:var(--t1)}
.strat-val.s-sm{font-size:12px}

/* ── Reset Section ── */
.reset-content{text-align:center}
.reset-title{font-size:clamp(28px,4vw,48px);font-weight:700;letter-spacing:-1px;margin-bottom:16px}
.reset-sub{font-size:16px;color:var(--t2);margin-bottom:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 32px;border-radius:100px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s var(--ease)}
.btn-primary{background:var(--accent);color:#000;box-shadow:0 4px 16px var(--accent-glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--accent-glow)}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--t1);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,0.12)}
.btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ── History Drawer ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;opacity:0;pointer-events:none;transition:opacity 0.3s var(--ease)}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;width:420px;max-width:90vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:201;transform:translateX(100%);transition:transform 0.4s var(--ease);overflow-y:auto;padding:24px}
.drawer.open{transform:translateX(0)}
.drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.drawer-title{font-size:18px;font-weight:700}
.drawer-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.drawer-item{padding:14px 16px;margin:4px 0;border-radius:12px;background:rgba(255,255,255,0.02);border:1px solid var(--border);cursor:pointer;transition:all 0.2s var(--ease)}
.drawer-item:hover{background:rgba(255,255,255,0.05);border-color:var(--border-strong)}
.drawer-item-name{font-size:14px;font-weight:600}
.drawer-item-meta{font-size:12px;color:var(--t3);margin-top:4px;display:flex;gap:12px}
.drawer-pagination{display:flex;gap:6px;justify-content:center;margin-top:16px}
.drawer-pagination button{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;font-size:12px}
.drawer-pagination button.active{background:var(--accent);color:#000;border-color:var(--accent)}

/* ── AI text ── */
.ai-text{font-size:15px;line-height:1.75;color:var(--t2)}
.ai-text strong{color:var(--t1);font-weight:600}

/* ── Expandable section ── */
.expand-section{border-radius:var(--radius);overflow:hidden}
.expand-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px;cursor:pointer;user-select:none;
  font-size:14px;font-weight:600;color:var(--t1);
  transition:background 0.2s var(--ease);
}
.expand-header:hover{background:rgba(255,255,255,0.03)}
.expand-chevron{
  font-size:12px;color:var(--t3);
  transition:transform 0.3s var(--ease);
  display:inline-block;
}
.expand-section.open .expand-chevron{transform:rotate(180deg)}
.expand-body{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height 0.4s var(--ease), opacity 0.3s var(--ease), padding 0.3s var(--ease);
  padding:0 22px;
}
.expand-section.open .expand-body{
  max-height:3000px;opacity:1;padding:0 22px 20px;
}
.expand-section:not(.open) .expand-body{padding-top:0;padding-bottom:0}

/* ── AI 速览 card ── */
.speed-read-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:100px;
  background:rgba(59,130,246,0.12);color:#60a5fa;
  font-size:11px;font-weight:600;letter-spacing:0.5px;
  margin-bottom:20px;
}
.speed-read-body{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.sr-metrics{flex:1;min-width:180px;display:flex;flex-direction:column;gap:12px}
.sr-row{display:flex;align-items:center;gap:8px}
.sr-label{font-size:12px;color:var(--t3);width:36px;flex-shrink:0}
.sr-value{font-size:15px;font-weight:600;color:var(--t1)}
.sr-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600;
}
.sr-badge.up{background:rgba(255,107,107,0.12);color:var(--up)}
.sr-badge.down{background:rgba(81,207,102,0.12);color:var(--down)}
.sr-badge.neutral{background:rgba(245,158,11,0.12);color:var(--accent)}
.sr-badge.risk-low{background:rgba(81,207,102,0.12);color:#51cf66}
.sr-badge.risk-mid{background:rgba(245,158,11,0.12);color:var(--accent)}
.sr-badge.risk-high{background:rgba(255,107,107,0.12);color:var(--up)}
.sr-summary{
  margin-top:18px;padding-top:16px;border-top:1px solid var(--border);
  font-size:14px;color:var(--t2);line-height:1.6;
}
.sr-suggestion{font-size:14px;color:var(--t1);font-weight:500}

/* ── AI explanation items ── */
.explain-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 14px;margin-bottom:8px;
  border-radius:12px;background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
}
.explain-icon{
  width:32px;height:32px;border-radius:8px;
  background:rgba(59,130,246,0.1);color:#60a5fa;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}
.explain-text{font-size:14px;color:var(--t2);line-height:1.65;padding-top:5px}

/* ── Professional details table ── */
.pro-section-title{
  font-size:11px;font-weight:600;color:var(--t3);
  text-transform:uppercase;letter-spacing:1px;
  padding:8px 14px;margin-bottom:4px;
  border-bottom:1px solid var(--border);
}
.pro-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 14px;font-size:13px;
  border-radius:8px;transition:background 0.15s;
}
.pro-row:hover{background:rgba(255,255,255,0.02)}
.pro-row-label{color:var(--t3)}
.pro-row-value{color:var(--t1);font-weight:500;font-variant-numeric:tabular-nums}
.pro-detail-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.pro-detail-block{
  padding:12px 14px;border-radius:10px;
  background:rgba(255,255,255,0.02);border:1px solid var(--border);
}
.pro-block-title{font-size:11px;color:var(--t3);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.pro-block-row{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);margin-bottom:4px}
.pro-block-row span:last-child{color:var(--t1);font-weight:500}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;background:rgba(255,255,255,0.05);color:var(--t2)}

/* ── Mode toggle ── */
.mode-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mode-beginner-dot{background:#51cf66;box-shadow:0 0 6px rgba(81,207,102,0.5)}
.mode-pro-dot{background:#60a5fa;box-shadow:0 0 6px rgba(96,165,250,0.5)}

/* ── Help popover ── */
.help-popover{
  background:var(--surface);color:var(--t2);font-size:12px;line-height:1.6;
  padding:14px 16px;border-radius:12px;border:1px solid var(--border-strong);
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
  animation:helpFadeIn 0.2s ease;
}
.help-popover strong{color:var(--t1);font-size:13px}
@keyframes helpFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── Responsive ── */
@media(max-width:768px){
  .stock-hero{flex-direction:column}
  .stock-price{font-size:32px}
  .hero-title{font-size:32px}
  .speed-read-body{flex-direction:column;align-items:flex-start}
  .drawer{width:100vw}
  .section{padding:24px 16px}
  .pro-detail-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="bg-orbs"><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div></div>

<!-- Top Nav -->
<nav class="top-nav">
  <div class="nav-logo">
    <div class="nav-logo-icon">◆</div>
    <span class="nav-logo-text">SnapVision</span>
  </div>
  <div class="nav-actions">
    <button class="nav-btn" onclick="openWatchlistDrawer()" id="btn-watchlist-nav">⭐ 我的关注</button>
    <button class="nav-btn" onclick="openDrawer()" data-i18n>History</button>
    <button class="nav-btn" onclick="I18n.toggle()" id="lang-switch" data-i18n>EN</button>
  </div>
</nav>

<!-- History Drawer -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title" data-i18n>Analysis History</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawer-list"></div>
  <div class="drawer-pagination" id="drawer-pagination"></div>
</div>

<!-- Watchlist Drawer -->
<div class="drawer-overlay" id="wl-overlay" onclick="closeWatchlistDrawer()"></div>
<div class="drawer" id="wl-drawer">
  <div class="drawer-header">
    <span class="drawer-title">⭐ 我的关注</span>
    <button class="drawer-close" onclick="closeWatchlistDrawer()">✕</button>
  </div>
  <div id="wl-list"></div>
</div>

<!-- Scroll Container -->
<div class="scroll-container" id="scroll-container">

  <!-- SECTION 1: HERO / UPLOAD -->
  <section class="section active" id="sec-hero">
    <div class="section-inner hero-content">
      <h1 class="hero-title">AI 股票分析系统</h1>
      <p class="hero-sub">上传截图，即可生成 AI 趋势分析与风险判断</p>
      <div class="upload-zone glass" id="upload-zone">
        <div class="scan-line"></div>
        <div class="upload-icon">📡</div>
        <h3>点击或拖拽上传股票截图</h3>
        <p>支持 JPG、PNG、GIF、WebP — 最大 10MB</p>
        <input type="file" id="file-input" accept="image/*" style="display:none">
      </div>
      <div class="file-chosen" id="file-info">
        <span>📎</span><span id="file-name"></span>
      </div>
      <div id="loading-indicator" style="display:none;margin-top:24px">
        <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin 0.8s linear infinite;margin:0 auto 12px"></div>
        <p style="color:var(--t2);font-size:14px">AI 正在分析…</p>
      </div>
    </div>
  </section>

  <!-- SECTION 2: ANALYSIS -->
  <section class="section" id="sec-analysis">
    <div class="section-inner">
      <div class="analysis-layout">

        <!-- Stock Hero + Charts -->
        <div class="glass" style="padding:28px">
          <div class="stock-hero">
            <div><div class="stock-name" id="stock-name">--</div><div class="stock-code" id="stock-code">--</div></div>
            <div><div class="stock-price" id="current-price">--</div><div class="stock-change flat" id="change-percent">--</div></div>
          </div>
          <div class="chart-wrap"><canvas id="kline-chart"></canvas></div>
          <div class="chart-wrap vol"><canvas id="volume-chart"></canvas></div>
        </div>

        <!-- ═══ Layer 1: AI 速览 (always visible) ═══ -->
        <div class="glass" style="padding:28px" id="speed-read-card">
          <div class="speed-read-badge">🤖 AI 速览</div>
          <div class="speed-read-body">
            <div class="score-ring" style="width:120px;height:120px;flex-shrink:0">
              <svg width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>
                <circle id="score-arc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 60 60)"/>
              </svg>
              <div class="score-inner">
                <div class="score-num" id="score-num" style="font-size:34px">--</div>
                <div class="score-label">AI 评分</div>
              </div>
            </div>
            <div class="sr-metrics">
              <div class="sr-row">
                <span class="sr-label">趋势</span>
                <span class="sr-badge neutral" id="sr-trend">--</span>
              </div>
              <div class="sr-row">
                <span class="sr-label">风险</span>
                <span class="sr-badge neutral" id="sr-risk">--</span>
              </div>
              <div class="sr-row">
                <span class="sr-label">建议</span>
                <span class="sr-suggestion" id="sr-suggestion">--</span>
              </div>
            </div>
          </div>
          <div class="sr-summary" id="sr-summary">上传股票截图，AI 将自动生成综合分析</div>
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);display:flex;gap:10px">
            <button class="btn btn-primary" id="btn-add-watchlist" style="padding:8px 20px;font-size:13px" onclick="addToWatchlist()">⭐ 加入关注</button>
          </div>
        </div>

        <!-- ═══ Layer 2: AI 解释 (expandable) ═══ -->
        <div class="glass expand-section" id="expand-explain">
          <div class="expand-header" onclick="toggleExpand('expand-explain')">
            <span>💡 AI 分析依据</span>
            <span class="expand-chevron" id="expand-explain-chevron">▼</span>
          </div>
          <div class="expand-body" id="expand-explain-body">
            <div id="explain-list"></div>
          </div>
        </div>

        <!-- ═══ Layer 3: 专业详情 (expandable, default collapsed) ═══ -->
        <div class="glass expand-section" id="expand-details">
          <div class="expand-header" onclick="toggleExpand('expand-details')">
            <span>🔬 专业详情</span>
            <span class="expand-chevron" id="expand-details-chevron">▼</span>
          </div>
          <div class="expand-body" id="expand-details-body">
            <div id="pro-details-content"></div>
          </div>
        </div>

        <!-- Full AI analysis text (inside professional details for reference) -->
        <div class="glass" style="padding:24px" id="analysis-text-wrap" hidden>
          <div class="ai-text" id="analysis-text"></div>
        </div>

      </div>
    </div>
  </section>

  <!-- SECTION 3: RESET -->
  <section class="section" id="sec-reset">
    <div class="section-inner reset-content">
      <h2 class="reset-title">分析完成</h2>
      <p class="reset-sub">上传新的股票截图，开始下一次分析</p>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="scrollToSection(0)">上传新截图</button>
        <button class="btn btn-ghost" onclick="openDrawer()">查看历史记录</button>
      </div>
    </div>
  </section>

</div>

<script src="./js/i18n.js"></script>
<script src="./js/api.js"></script>
<script src="./js/chart.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
