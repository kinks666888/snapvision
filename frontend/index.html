<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapVision | 智能看盘助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }
        .upload-zone {
            transition: all 0.3s ease;
        }
        .upload-zone.drag-over {
            background-color: #e0f2fe;
            border-color: #0284c7;
        }
        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin: 20px 0;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="text-2xl">📊</div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">SnapVision</h1>
                        <p class="text-sm text-gray-500">智能看盘助手</p>
                    </div>
                </div>
                <nav class="flex gap-4">
                    <button onclick="showSection('upload')" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded">
                        分析
                    </button>
                    <button onclick="showSection('history')" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded">
                        历史
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Upload Section -->
        <section id="upload-section" class="space-y-6">
            <div class="bg-white rounded-lg shadow">
                <!-- Upload Zone -->
                <div class="p-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-900">上传 K 线图片</h2>
                    
                    <div 
                        id="upload-zone" 
                        class="upload-zone border-2 border-dashed border-gray-300 rounded-lg p-12 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition"
                    >
                        <div class="mb-4 text-4xl">📁</div>
                        <h3 class="text-lg font-medium text-gray-900 mb-2">拖拽或点击上传图片</h3>
                        <p class="text-gray-600 text-sm mb-4">支持 JPG、PNG、GIF、WebP 格式（最大 10MB）</p>
                        <p class="text-gray-500 text-xs">文件名格式建议：600519_贵州茅台.png</p>
                        <input 
                            type="file" 
                            id="file-input" 
                            accept="image/*" 
                            class="hidden"
                        >
                    </div>

                    <!-- File Info -->
                    <div id="file-info" class="mt-4 hidden">
                        <p class="text-sm text-gray-600">已选择: <span id="file-name" class="font-mono text-blue-600"></span></p>
                    </div>
                </div>

                <!-- Result Section -->
                <div id="result-section" class="hidden border-t p-8 bg-gradient-to-b from-gray-50 to-white">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Stock Info -->
                        <div class="lg:col-span-2">
                            <div class="bg-white rounded-lg border p-6 mb-6">
                                <div class="flex justify-between items-start mb-6">
                                    <div>
                                        <h3 id="stock-name" class="text-2xl font-bold text-gray-900"></h3>
                                        <p id="stock-code" class="text-gray-600">代码: </p>
                                    </div>
                                    <div class="text-right">
                                        <div id="current-price" class="text-3xl font-bold text-gray-900"></div>
                                        <div id="change-percent" class="text-lg font-semibold"></div>
                                    </div>
                                </div>

                                <!-- K Line Chart -->
                                <div class="chart-container">
                                    <canvas id="kline-chart"></canvas>
                                </div>
                            </div>

                            <!-- Analysis Text -->
                            <div class="bg-white rounded-lg border p-6">
                                <h4 class="text-lg font-semibold text-gray-900 mb-4">分析报告</h4>
                                <p id="analysis-text" class="text-gray-700 leading-relaxed"></p>
                            </div>
                        </div>

                        <!-- Indicators Panel -->
                        <div>
                            <div class="bg-white rounded-lg border p-6 space-y-4">
                                <h4 class="text-lg font-semibold text-gray-900">技术指标</h4>
                                
                                <!-- Support/Resistance -->
                                <div class="space-y-3 border-b pb-4">
                                    <div>
                                        <p class="text-sm text-gray-600">支撑位</p>
                                        <p id="support-value" class="text-xl font-bold text-red-600"></p>
                                    </div>
                                    <div>
                                        <p class="text-sm text-gray-600">压力位</p>
                                        <p id="resistance-value" class="text-xl font-bold text-green-600"></p>
                                    </div>
                                </div>

                                <!-- MACD -->
                                <div class="space-y-3 border-b pb-4">
                                    <div>
                                        <p class="text-sm text-gray-600">MACD</p>
                                        <p id="macd-value" class="text-lg font-mono text-gray-900"></p>
                                    </div>
                                    <div>
                                        <p class="text-sm text-gray-600">信号线</p>
                                        <p id="signal-value" class="text-lg font-mono text-gray-900"></p>
                                    </div>
                                    <div>
                                        <p class="text-sm text-gray-600">柱状图</p>
                                        <p id="histogram-value" class="text-lg font-mono text-gray-900"></p>
                                    </div>
                                </div>

                                <!-- Crossover -->
                                <div class="border-b pb-4">
                                    <p class="text-sm text-gray-600 mb-2">信号</p>
                                    <div id="crossover-badge" class="inline-block px-3 py-1 rounded-full text-sm font-semibold"></div>
                                </div>

                                <!-- Recommendation -->
                                <div>
                                    <p class="text-sm text-gray-600 mb-2">建议</p>
                                    <div id="recommendation-badge" class="inline-block px-3 py-1 rounded-full text-sm font-semibold"></div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="mt-6 space-y-3">
                                <button 
                                    onclick="downloadReport()" 
                                    class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"
                                >
                                    📥 下载报告
                                </button>
                                <button 
                                    onclick="resetUpload()" 
                                    class="w-full bg-gray-200 text-gray-900 px-4 py-2 rounded-lg hover:bg-gray-300 transition"
                                >
                                    🔄 重新上传
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="hidden border-t p-8 text-center">
                    <div class="flex justify-center mb-4">
                        <div class="spinner"></div>
                    </div>
                    <p class="text-gray-600">正在分析图片...</p>
                </div>

                <!-- Error State -->
                <div id="error-state" class="hidden border-t p-8 bg-red-50">
                    <div class="flex items-start gap-4">
                        <div class="text-2xl">⚠️</div>
                        <div>
                            <h4 class="font-semibold text-red-900">分析出错</h4>
                            <p id="error-message" class="text-red-700 text-sm mt-1"></p>
                            <button 
                                onclick="resetUpload()" 
                                class="mt-3 text-sm text-red-700 hover:text-red-900 font-semibold"
                            >
                                重新尝试
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- History Section -->
        <section id="history-section" class="hidden">
            <div class="bg-white rounded-lg shadow">
                <div class="p-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-900">分析历史</h2>
                    
                    <!-- History List -->
                    <div id="history-list" class="space-y-3">
                        <p class="text-gray-600 text-center py-8">加载中...</p>
                    </div>

                    <!-- Pagination -->
                    <div id="pagination" class="flex justify-center gap-2 mt-6"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-gray-600 text-sm">
            <p>SnapVision © 2026 | 智能股票分析平台</p>
        </div>
    </footer>

    <script src="./js/api.js"></script>
    <script src="./js/chart.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
